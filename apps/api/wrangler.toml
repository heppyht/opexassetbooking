# OPEX VBM API — Cloudflare Worker (server-side authorization layer)
#
# This worker provides trusted server-side authorization for the OPEX Asset
# Booking Add-In. It verifies MyGeotab session IDs, resolves user roles,
# and enforces authorization for protected booking operations.
#
# AddInData remains the primary application persistence layer. This worker
# does NOT use PostgreSQL or any other database.

name = "opex-vbm-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[vars]
# Any value other than "development" hides internal error messages
APP_ENV = "production"

# Exact browser origin of the frontend: scheme + lowercase host, no path, no trailing slash
ALLOWED_ORIGIN = "https://heppyh.github.io"

# MyGeotab database the API accepts sessions for
GEOTAB_DATABASE = "opex_trial"

# Service account credentials for server-side AddInData access
# These MUST be set via wrangler secret put (never in .dev.vars or version control)
# GEOTAB_SERVICE_USERNAME
# GEOTAB_SERVICE_PASSWORD
# GEOTAB_SERVICE_SERVER

[[migrations]]
tag = "v1"
preview_script = "preview-opex-vbm-api"
production_script = "opex-vbm-api"
