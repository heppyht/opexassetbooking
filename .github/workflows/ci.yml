name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web TypeScript validation
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: API TypeScript validation
        run: npm --workspace apps/api run typecheck

      - name: Web application and provider-contract tests
        run: npm test

      - name: API Worker tests
        run: npm --workspace apps/api run test

      - name: Service Add-In build
        run: npm --workspace apps/web run build:service

      - name: Production build
        run: npm --workspace apps/web run build